name: CI

# Contributions come from branches of this private repository, and a pull request
# shows its branch's push checks, so a pull_request trigger would only rerun them.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha ||
    github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Xcode 27 is offered only on the xcode-27 image, which runs macOS 27:
  # https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available/
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  reuse:
    name: Reuse a passing branch run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Finds a branch run that already passed this tree
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: reuse
        name: Find a passing branch run
        run: make ci-reuse
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Build, lint, and test
    needs: reuse
    if:
      ${{ !cancelled() && needs.reuse.result != 'failure' &&
      needs.reuse.outputs.reused != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install developer tools
        run: |
          brew update
          brew install xcodegen zizmor shellcheck shfmt jq uv
          uv python install 3.15
          bun install --frozen-lockfile
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make coverage
      - name: Build the app
        run: make build

  build-tests:
    name: Build tests
    needs: reuse
    if:
      ${{ !cancelled() && needs.reuse.result != 'failure' &&
      needs.reuse.outputs.reused != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install developer tools
        run: brew install xcodegen syft jq
      - name: Build tests
        run: make build-for-testing
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: portable-tests
          path: |
            .build/portable-tests.tar
            .build/portable-runtime.tar
          if-no-files-found: error
          retention-days: 1
      - name: Archive and verify third-party notices
        id: archive
        run: make ci-dmg
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.archive.outcome != 'skipped' }}
        with:
          name: TypefaceOff-sbom
          path: .build/ci-distribution/TypefaceOff.xcarchive/TypefaceOff.spdx.json
          if-no-files-found: error
          include-hidden-files: true

  stage-support:
    name: Stage the Xcode 26.6 XCTest support
    needs: reuse
    if:
      ${{ !cancelled() && needs.reuse.result != 'failure' &&
      needs.reuse.outputs.reused != 'true' }}
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stage the support library
        run: make stage-support
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xctest-support-26
          path: .build/support.tar
          if-no-files-found: error
          retention-days: 1

  test-older-macos:
    name: Test on macOS ${{ matrix.macos }}
    needs: [build-tests, stage-support]
    # A skipped reuse job skips its indirect dependents too, even when the jobs in
    # between run, unless each overrides the default success() (actions/runner#2205).
    if:
      ${{ !cancelled() && needs.build-tests.result == 'success' &&
      needs.stage-support.result == 'success' }}
    runs-on: macos-${{ matrix.macos }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26.4 and later need macOS 26.2, so macOS 15 runs Xcode 26.3. Its XCTest
          # support library needs Testing symbols that Xcode 27 removed, so it runs
          # Xcode 26.6's library with that Xcode's XCTestCore, both staged above.
          - { macos: 15, xcode: "26.3", runtime: support }
          - { macos: 26, xcode: "26.6", runtime: testing }
    env:
      # The runners lack Xcode 27, so they run its bundles with their own Xcode 26.
      DEVELOPER_DIR:
        /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portable-tests
          path: .build
      - uses: actions/download-artifact@v8.0.2
        with:
          name: xctest-support-26
          path: .build
      - name: Launch the app
        run: make smoke-launch
      - name: Test
        run: make test-without-building

  release:
    name: Dispatch release
    needs: [reuse, test, build-tests, stage-support, test-older-macos]
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # Dispatches the release workflow after the main push passes its tests.
    steps:
      - run:
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f
          "ci_sha=$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
