name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# prettier-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build, lint, and test
    # Xcode 27 is offered only on the xcode-27 image, a public preview that runs macOS 27:
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install developer tools
        run: |
          brew install xcodegen zizmor shellcheck shfmt jq
          bun install --frozen-lockfile
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make coverage
      - name: Build the app
        run: make build

  build-tests:
    name: Build tests
    runs-on: macos-26
    env:
      # Xcode 26's Swift Testing overlay needs symbols that Xcode 27's Testing
      # lacks, so the older runners run bundles built by Xcode 26.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install developer tools
        run: brew install xcodegen
      - name: Build tests
        run: make build-for-testing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-tests
          path: .build/portable-tests.tar
          if-no-files-found: error
          retention-days: 1

  test-older-macos:
    name: Test on macOS ${{ matrix.macos }}
    needs: build-tests
    runs-on: macos-${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        # The test job already runs these tests on macOS 27.
        include:
          # Xcode 26.4 and later need macOS 26.2, so macOS 15 runs Xcode 26.3.
          - macos: 15
            xcode: "26.3"
          - macos: 26
            xcode: "26.6"
    env:
      DEVELOPER_DIR:
        /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-tests
          path: .build
      - name: Test
        run: make test-without-building
