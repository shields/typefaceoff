name: Release

on:
  workflow_dispatch:
    inputs:
      ci_sha:
        description: Main push whose checks must finish (supplied by CI)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: typefaceoff-release
  cancel-in-progress: false

env:
  # The Xcode that ci.yml tests with, so a release is built by the tested toolchain.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  queue:
    name: Select tested main commits
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Reads the three main push workflows for each release candidate.
      statuses: read # Finds the last completed commit for each channel.
    outputs:
      dmg: ${{ steps.queue.outputs.dmg }}
      store: ${{ steps.queue.outputs.store }}
      tap: ${{ steps.queue.outputs.tap }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A queued run may start after a newer main push.
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: queue
        run: bash scripts/release/queue.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ inputs.ci_sha }}

  dmg:
    name: Sign and notarize disk image
    needs: queue
    if: needs.queue.outputs.dmg != ''
    runs-on: xcode-27
    environment: developer-id
    timeout-minutes: 60
    outputs:
      published: ${{ steps.inspect.outputs.published }}
      artifact: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.queue.outputs.dmg }}
          fetch-depth: 0
          persist-credentials: false
      - id: inspect
        run: bash scripts/release/github.sh inspect
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.inspect.outputs.published == 'false'
        run: brew install xcodegen syft jq
      - if: steps.inspect.outputs.published == 'false'
        run: bash scripts/release/signing.sh
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - if: steps.inspect.outputs.published == 'false'
        run: make dmg
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      - if: steps.inspect.outputs.published == 'false'
        id: assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dmg-${{ needs.queue.outputs.dmg }}-${{ github.run_attempt }}
          path: .build/developer-id/assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish immutable disk image
    needs: [queue, dmg]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # Publishes the signed assets and their source tag.
      statuses: write # Records a verified published release.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.queue.outputs.dmg }}
          fetch-depth: 0
          persist-credentials: false
      - if: needs.dmg.outputs.published != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.dmg.outputs.artifact }}
          merge-multiple: true
          path: .build/developer-id/assets
      - run: bash scripts/release/github.sh publish
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash scripts/release/complete.sh dmg
        env:
          GH_TOKEN: ${{ github.token }}

  store:
    name: Upload and verify App Store build
    needs: queue
    if: needs.queue.outputs.store != ''
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 55
    permissions:
      contents: read
      statuses: write # Records Apple's successful processing of this build.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.queue.outputs.store }}
          fetch-depth: 0
          persist-credentials: false
      - run: brew install xcodegen syft jq
      - run: bash scripts/release/signing.sh
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          STORE_PROFILE: ${{ secrets.STORE_PROFILE }}
      - id: upload
        run: bash scripts/release/store.sh
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      - if: failure() && steps.upload.outputs.rejected == 'true'
        run: bash scripts/release/complete.sh store failure
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash scripts/release/complete.sh store
        env:
          GH_TOKEN: ${{ github.token }}

  tap:
    name: Update Homebrew cask
    needs: [queue, publish]
    if: >-
      !cancelled() && needs.queue.result == 'success' && (needs.publish.result
      == 'success' || needs.queue.outputs.tap != '')
    runs-on: ubuntu-26.04
    environment: homebrew
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write # Records the merged tap update.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref:
            ${{ needs.publish.result == 'success' && needs.queue.outputs.dmg ||
            needs.queue.outputs.tap }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3.4.0
        id: app
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: shields
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - id: propose
        run: bash scripts/release/tap.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_TOKEN: ${{ github.token }}
      - name: Wait for tap checks and merge
        if: steps.propose.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          branch="release/typefaceoff-$(tools/gitcalver.sh --prefix 0.)"
          pr=$(gh pr list -R shields/homebrew-tap --base main --head "$branch" --state all --json number,isCrossRepository |
            jq -er '[.[] | select(.isCrossRepository == false)] | max_by(.number).number')
          while true; do
            state=$(gh pr view "$pr" -R shields/homebrew-tap --json state --jq .state)
            case "$state" in
              MERGED) break ;;
              OPEN) sleep 20 ;;
              *) echo "Tap PR #$pr is $state" >&2; exit 1 ;;
            esac
          done
          GITHUB_OUTPUT="$RUNNER_TEMP/tap-confirmation" bash scripts/release/tap.sh
          grep -Fxq merged=true "$RUNNER_TEMP/tap-confirmation"
      - run: bash scripts/release/complete.sh tap
        env:
          GH_TOKEN: ${{ github.token }}
