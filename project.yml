name: TypefaceOff
configs:
  Debug: debug
  Release: release
  FuzzCoverage: release
  FuzzBenchmark: release
options:
  bundleIdPrefix: dev.msrl
  deploymentTarget:
    macOS: "15.0"
packages:
  TypefaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TypefaceOff:
    type: application
    platform: macOS
    sources: [Sources/TypefaceOff]
    dependencies:
      - package: TypefaceCore
        product: TypefaceCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Typeface/Off
        CFBundleName: Typeface/Off
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: Copyright © 2026 Michael Shields
        NSPrincipalClass: NSApplication
    entitlements:
      path: Config/TypefaceOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.msrl.typefaceoff
        CODE_SIGN_STYLE: Automatic
      configs:
        FuzzCoverage:
          PRODUCT_BUNDLE_IDENTIFIER: dev.msrl.typefaceoff.fuzz.coverage
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
        FuzzBenchmark:
          PRODUCT_BUNDLE_IDENTIFIER: dev.msrl.typefaceoff.fuzz.benchmark
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
  TypefaceOffTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TypefaceOffTests]
    dependencies:
      - target: TypefaceOff
      - package: TypefaceCore
        product: TypefaceCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TypefaceOff.app/Contents/MacOS/TypefaceOff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TypefaceOff:
    build:
      targets:
        TypefaceOff: all
    test:
      gatherCoverageData: true
      environmentVariables:
        TYPEFACEOFF_REVIEW_DIR: "$(TYPEFACEOFF_REVIEW_DIR)"
      targets:
        - TypefaceOffTests
