name: TypefaceOff
options:
  bundleIdPrefix: com.shields
  deploymentTarget:
    macOS: "15.0"
packages:
  TypefaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TypefaceOff:
    type: application
    platform: macOS
    sources: [Sources/TypefaceOff]
    dependencies:
      - package: TypefaceCore
        product: TypefaceCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Typeface/Off
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: Copyright © 2026 Michael Shields
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Typeface comparison
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.shields.typefaceoff.comparison]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.shields.typefaceoff.comparison
            UTTypeDescription: Typeface comparison
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [typefaceoff]
    entitlements:
      path: Config/TypefaceOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shields.typefaceoff
        CODE_SIGN_STYLE: Automatic
  TypefaceOffTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TypefaceOffTests]
    dependencies:
      - target: TypefaceOff
      - package: TypefaceCore
        product: TypefaceCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TypefaceOff.app/Contents/MacOS/TypefaceOff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TypefaceOff:
    build:
      targets:
        TypefaceOff: all
    test:
      gatherCoverageData: true
      environmentVariables:
        TYPEFACEOFF_REVIEW_DIR: "$(TYPEFACEOFF_REVIEW_DIR)"
      targets:
        - TypefaceOffTests
