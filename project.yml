name: TypefaceOff
configs:
  Debug: debug
  Release: release
  FuzzCoverage: release
  FuzzBenchmark: release
  StartupBenchmark: release
configFiles:
  Debug: Config/Development.xcconfig
  FuzzCoverage: Config/Development.xcconfig
  FuzzBenchmark: Config/Development.xcconfig
  StartupBenchmark: Config/Development.xcconfig
options:
  bundleIdPrefix: com.typefaceoff
  deploymentTarget:
    macOS: "15.0"
packages:
  TypefaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TypefaceOff:
    type: application
    platform: macOS
    sources:
      - path: Sources/TypefaceOff
        excludes: [AppIcon.icon]
      # Icon Composer compilation supplies the .icns fallback and the bundle's icon metadata.
      - path: Sources/TypefaceOff/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TypefaceCore
        product: TypefaceCore
    info:
      path: Config/Info.plist
      properties:
        # Match the filename so macOS honors the display name in InfoPlist.strings.
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.graphics-design
        LSHasLocalizedDisplayName: true
        NSHumanReadableCopyright: Copyright © 2026 Michael Shields
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/TypefaceOff.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/TestFlight.entitlements
        FuzzCoverage:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.fuzz.coverage
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
        FuzzBenchmark:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.fuzz.benchmark
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
        StartupBenchmark:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.startup-benchmark
          CLANG_ENABLE_CODE_COVERAGE: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS:
            $(inherited) TYPEFACEOFF_STARTUP_BENCHMARK
    configFiles:
      Release: Config/Signing.xcconfig
  TypefaceOffTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TypefaceOffTests]
    dependencies:
      - target: TypefaceOff
      - package: TypefaceCore
        product: TypefaceCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TypefaceOff.app/Contents/MacOS/TypefaceOff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TypefaceOff:
    build:
      targets:
        TypefaceOff: all
    archive:
      config: Release
    test:
      gatherCoverageData: true
      environmentVariables:
        TYPEFACEOFF_TESTING: "1"
        TYPEFACEOFF_REVIEW_DIR: "$(TYPEFACEOFF_REVIEW_DIR)"
      targets:
        - TypefaceOffTests
  PortableTests:
    build:
      targets:
        TypefaceOff: all
    test:
      environmentVariables:
        TYPEFACEOFF_TESTING: "1"
      targets:
        - TypefaceOffTests
        # XcodeGen decodes a `package` key as a Swift package test target; a bare
        # "<a>/<b>" string would instead name target <b> in another project <a>.
        - package: TypefaceCore/TypefaceCoreTests
