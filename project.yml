name: TypefaceOff
configs:
  Debug: debug
  Release: release
  FuzzCoverage: release
  FuzzBenchmark: release
  StartupBenchmark: release
configFiles:
  Debug: Config/Development.xcconfig
  FuzzCoverage: Config/Development.xcconfig
  FuzzBenchmark: Config/Development.xcconfig
  StartupBenchmark: Config/Development.xcconfig
options:
  bundleIdPrefix: com.typefaceoff
  deploymentTarget:
    macOS: "15.0"
packages:
  TypefaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
aggregateTargets:
  AppVersion:
    targets: []
    settings:
      # Git needs the working tree and the shared Git directory of linked worktrees.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Embed gitcalver version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Config/Info.plist
        outputFiles:
          - $(CONFIGURATION_TEMP_DIR)/TypefaceOff-Info.plist
        script: |
          set -eu
          version=${TYPEFACEOFF_RELEASE_VERSION:-}
          if [ -z "$version" ]; then version=$("$SRCROOT/tools/gitcalver.sh" --prefix 0. --dirty -dirty); fi
          plutil -insert TypefaceOffDisplayVersion -string "$version" -o "$SCRIPT_OUTPUT_FILE_0" "$SCRIPT_INPUT_FILE_0"
targets:
  TypefaceOff:
    type: application
    platform: macOS
    sources:
      - path: Sources/TypefaceOff
        excludes: [AppIcon.icon]
      # Icon Composer compilation supplies the .icns fallback and the bundle's icon metadata.
      - path: Sources/TypefaceOff/AppIcon.icon
        type: file
        buildPhase: resources
    postBuildScripts:
      - name: Generate third-party notices
        inputFiles:
          - $(SRCROOT)/NOTICE
          - $(SRCROOT)/scripts/app-notice.sh
          - $(SRCROOT)/scripts/app-provenance.jq
          - $(SRCROOT)/Sources/TypefaceCore/Resources/languages.json
          - $(SRCROOT)/Sources/TypefaceCore/Resources/character-frequencies.tsv
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Acknowledgments.txt
        script: |
          set -eu
          sh "$SRCROOT/scripts/app-notice.sh" "$SRCROOT/Sources/TypefaceCore/Resources" > "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - target: AppVersion
      - package: TypefaceCore
        product: TypefaceCore
    info:
      path: Config/Info.plist
      properties:
        # Match the filename so macOS honors the display name in InfoPlist.strings.
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.graphics-design
        LSHasLocalizedDisplayName: true
        NSHumanReadableCopyright: Copyright © 2026 Michael Shields
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/TypefaceOff.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: $(CONFIGURATION_TEMP_DIR)/TypefaceOff-Info.plist
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          TYPEFACEOFF_ENTITLEMENTS: Config/TestFlight.entitlements
          CODE_SIGN_ENTITLEMENTS: $(TYPEFACEOFF_ENTITLEMENTS)
          PROVISIONING_PROFILE_SPECIFIER: $(TYPEFACEOFF_PROFILE)
        FuzzCoverage:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.fuzz.coverage
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
        FuzzBenchmark:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.fuzz.benchmark
          CODE_SIGN_ENTITLEMENTS: ""
          CLANG_ENABLE_CODE_COVERAGE: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPEFACEOFF_FUZZING
        StartupBenchmark:
          PRODUCT_BUNDLE_IDENTIFIER: com.typefaceoff.startup-benchmark
          CLANG_ENABLE_CODE_COVERAGE: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_ACTIVE_COMPILATION_CONDITIONS:
            $(inherited) TYPEFACEOFF_STARTUP_BENCHMARK
    configFiles:
      Release: Config/Signing.xcconfig
  TypefaceOffTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TypefaceOffTests]
    dependencies:
      - target: TypefaceOff
      - package: TypefaceCore
        product: TypefaceCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TypefaceOff.app/Contents/MacOS/TypefaceOff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TypefaceOff:
    build:
      targets:
        TypefaceOff: all
    archive:
      config: Release
    test:
      gatherCoverageData: true
      environmentVariables:
        TYPEFACEOFF_TESTING: "1"
        TYPEFACEOFF_REVIEW_DIR: "$(TYPEFACEOFF_REVIEW_DIR)"
        TYPEFACEOFF_STORE_SCREENSHOTS: "$(TYPEFACEOFF_STORE_SCREENSHOTS)"
      targets:
        - TypefaceOffTests
  PortableTests:
    build:
      targets:
        TypefaceOff: all
    test:
      environmentVariables:
        TYPEFACEOFF_TESTING: "1"
      targets:
        - TypefaceOffTests
        # XcodeGen decodes a `package` key as a Swift package test target; a bare
        # "<a>/<b>" string would instead name target <b> in another project <a>.
        - package: TypefaceCore/TypefaceCoreTests
