[project]
name = "typefaceoff-language-tooling"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = ["hyperglot==0.8.1"]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.uv]
exclude-newer = "3 days"
package = false

[tool.pytest.ini_options]
testpaths = ["Tests/LanguageDataTests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "C90",
  "D",
  "PLR09",
  "T201",
  "RUF001",
  "RUF002",
  "RUF003",
  "W191",
  "E111",
  "E114",
  "E117",
  "COM812",
  "COM819",
  "Q",
  "CPY001",
  "INP001",
]

[tool.ruff.lint.per-file-ignores]
"Tests/LanguageDataTests/*.py" = ["S101", "PLR2004"]

[tool.ty.rules]
unresolved-import = "error"

[tool.ty.environment]
extra-paths = ["scripts"]
